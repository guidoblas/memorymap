<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi diario</title>
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#1b2a33;--muted:#5b6b73;--accent:#1f6f78;--accent-ink:#fff;--line:#d5dde1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--surface:#1b262c;--ink:#e6eef1;--muted:#9bacb4;--accent:#6cc3cb;--accent-ink:#0d1a1d;--line:#2c3a42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1f;--surface:#1b262c;--ink:#e6eef1;--muted:#9bacb4;--accent:#6cc3cb;--accent-ink:#0d1a1d;--line:#2c3a42;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.2 "Iowan Old Style",Georgia,serif;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
textarea{min-height:120px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{width:100%;font:600 16px system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;cursor:pointer}
h2{font:600 18px/1.3 system-ui,sans-serif;margin:28px 0 12px}
.nota{margin-bottom:12px}
.nota time{font-size:13px;color:var(--muted)}
.nota h3{font:600 20px/1.3 "Iowan Old Style",Georgia,serif;margin:2px 0 6px}
.nota p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.del{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:4px 0;cursor:pointer;text-decoration:underline}
.vacio{color:var(--muted);text-align:center;padding:24px 8px}
.btn2{font:inherit;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:10px;padding:8px 12px;cursor:pointer;margin:-4px 0 8px}
.estado{font-size:14px;color:var(--muted);min-height:1.2em;margin-bottom:12px}
.lugar{font-size:14px;color:var(--muted)}
.media{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px 0 10px}
.media>*{flex:0 0 88%;min-width:0;scroll-snap-align:start;max-height:420px;object-fit:contain;border-radius:10px;background:var(--bg)}
.media>*:only-child{flex-basis:100%}
.fila{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fila .btn2{margin:0}
.lugar a{color:var(--accent)}
.etq{display:inline-block;margin-left:8px;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px}
.del+.del{margin-left:16px}
#mapa{height:55vh;min-height:320px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px}
.sug{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.resaltado{outline:3px solid var(--accent)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.velo{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
.velo form{max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.top h1{flex:1;margin:0}
.ic{font:600 20px system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;cursor:pointer}
.menu{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:320px;background:var(--surface);border-right:1px solid var(--line);z-index:1500;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;transform:translateX(-105%);transition:transform .2s}
.cortina{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1400}
.it{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-radius:10px;padding:12px;cursor:pointer}
.it:hover,.it:focus-visible{background:var(--bg)}
.it.sub{padding-left:28px;font-size:15px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
input[type=checkbox]{width:auto;margin:0}
.aviso{color:#b3261e;font-size:14px;margin:-6px 0 12px;min-height:1em}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<main>
<div class="top"><button class="ic" id="btnMenu" type="button" aria-label="Abrir menú">☰</button><h1>Mi diario</h1><button class="ic" id="btnNuevo" type="button" aria-label="Nuevo recuerdo">+</button></div>
<p id="saludo" style="margin:-8px 0 14px;color:var(--muted)"></p>
<div id="mapaBox"><div id="mapa"></div></div>
<div id="secForm" style="display:none">
<form class="card" id="form" onsubmit="return false">
<label for="fecha">Fecha del recuerdo</label>
<input id="fecha" type="date">
<label for="titulo">Título</label>
<input id="titulo" maxlength="120" autocomplete="off">
<label for="texto">Qué quiero recordar</label>
<textarea id="texto"></textarea>
<label for="cat">Categoría</label>
<select id="cat"></select>
<input id="catNueva" maxlength="40" autocomplete="off" placeholder="Nombre de la categoría nueva" style="display:none">
<label>Foto o video</label>
<div class="fila">
<button class="btn2" type="button" id="bFoto">Sacar foto</button>
<button class="btn2" type="button" id="bVideo">Grabar video</button>
<button class="btn2" type="button" id="bGaleria">Galería</button>
</div>
<input id="inFoto" type="file" accept="image/*" capture="environment" hidden>
<input id="inVideo" type="file" accept="video/*" capture="environment" hidden>

<div class="estado" id="estadoMedia"></div>
<button class="del" id="vaciar" type="button" style="display:none;margin:-6px 0 12px">Quitar archivos elegidos</button>
<label for="lugar">Lugar (obligatorio)</label>
<input id="lugar" maxlength="160" autocomplete="off" placeholder="Buscá un lugar, ej: Roma">
<div class="fila"><button class="btn2" id="buscar" type="button">Buscar</button><button class="btn2" id="enMapa" type="button">Elegir en el mapa</button><button class="btn2" id="ubic" type="button">Mi ubicación</button></div>
<div id="sugs"></div>

<button class="save" id="guardar" type="button">Guardar recuerdo</button>

</div>
<div id="secBuscar" class="card" style="display:none;margin-bottom:12px">
<label for="qTexto">Palabras clave</label>
<input id="qTexto" maxlength="60" autocomplete="off" placeholder="Título, texto o lugar">
<label for="qCat">Categoría</label>
<select id="qCat"></select>
<label class="chk"><input type="checkbox" id="qZona"> Solo lo que se ve en el mapa</label>
</div>
<div id="secLista">
<h2>Mis recuerdos</h2>
<div class="estado" id="contador"></div>
<button class="btn2" id="qLimpiar" type="button" style="display:none;margin:0 0 12px">Quitar filtros</button>

</div>
<div id="secPerfil" style="display:none">
<h2>Mi perfil</h2>
<div class="card">
<div class="fila"><button class="btn2" id="bPerfil" type="button">Editar mi perfil</button></div>
<div class="estado" id="estadoPerfil"></div>
</div>
</div>
<div id="secCopia" style="display:none">
<h2>Copia de seguridad</h2>
<div class="card">
<div class="fila"><button class="btn2" id="bExp" type="button">Exportar copia</button><button class="btn2" id="bImp" type="button">Importar copia</button></div>
<input id="inImp" type="file" accept=".zip,application/zip" hidden>
<div class="estado" id="estadoCopia">Guardá el archivo en tu nube de vez en cuando.</div>
</div>
</div>
</main>
<div id="cortina" class="cortina" style="display:none"></div>
<nav id="menu" class="menu" aria-label="Menú">
<button class="it" type="button" data-vista="nuevo">Nuevo recuerdo</button>
<button class="it" type="button" data-vista="hilo">Hilo de vida</button>
<button class="it" type="button" data-vista="mapa">Mapa de vida</button>
<button class="it" type="button" id="itCat">Categoría ▾</button>
<div id="menuCats" style="display:none"></div>
<button class="it" type="button" data-vista="buscar">Buscar</button>
<button class="it" type="button" data-vista="perfil">Mi perfil</button>
<button class="it" type="button" data-vista="copia">Copia de seguridad</button>
</nav>
<div id="perfilBox" class="velo" style="display:none">
<form class="card" onsubmit="return false">
<h2 id="perfilTitulo" style="margin-top:0">Creá tu perfil</h2>
<label for="pNombre">Nombre</label>
<input id="pNombre" maxlength="40" autocomplete="off">
<label for="pGenero">Sexo</label>
<select id="pGenero"><option value="">Elegí una opción</option><option value="hombre">Hombre</option><option value="mujer">Mujer</option><option value="otre">Otre</option></select>
<div class="aviso" id="pAviso" role="alert"></div>
<button class="save" id="pGuardar" type="button">Guardar perfil</button>

</form>

<script>
var CLAVE = "diario:entradas";
var entradas = [];
function cargar(){
  try { var v = localStorage.getItem(CLAVE); entradas = v ? JSON.parse(v) : []; }
  catch(e){ entradas = []; }
  entradas.forEach(normalizar);
}
function normalizar(n){
  if(!n.media) n.media = [];
  else if(!Array.isArray(n.media)) n.media = [n.media];
  return n;
}
function guardarTodo(){
  try { localStorage.setItem(CLAVE, JSON.stringify(entradas)); return true; }
  catch(e){ return false; }
}
var DB = null;
function abrirDB(){
  return new Promise(function(ok, no){
    try {
      var r = indexedDB.open("diario-media", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("media"); };
      r.onsuccess = function(){ DB = r.result; ok(); };
      r.onerror = function(){ no(r.error); };
    } catch(e){ no(e); }
  });
}
function guardarMedia(id, blob){
  return new Promise(function(ok, no){
    var tx = DB.transaction("media", "readwrite");
    tx.objectStore("media").put(blob, id);
    tx.oncomplete = ok;
    tx.onerror = function(){ no(tx.error); };
  });
}
function leerMedia(id){
  return new Promise(function(ok){
    try {
      var rq = DB.transaction("media").objectStore("media").get(id);
      rq.onsuccess = function(){ ok(rq.result || null); };
      rq.onerror = function(){ ok(null); };
    } catch(e){ ok(null); }
  });
}
function borrarMedia(id){
  try { DB.transaction("media", "readwrite").objectStore("media").delete(id); } catch(e){}
}
function reducirImagen(file){
  return new Promise(function(ok){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ ok(b || file); }, "image/jpeg", 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}
function mostrarMedia(box, m){
  var el = document.createElement(m.tipo === "video" ? "video" : "img");
  if(m.tipo === "video"){ el.controls = true; el.preload = "metadata"; el.playsInline = true; }
  else { el.alt = "Foto del recuerdo"; }
  box.append(el);
  leerMedia(m.id).then(function(blob){
    if(!blob){ el.remove(); return; }
    el.src = URL.createObjectURL(blob);
  });
}
var CLAVE_CAT = "diario:categorias";
var categorias = [];
var editando = null;
function cargarCats(){
  try { var v = localStorage.getItem(CLAVE_CAT); categorias = v ? JSON.parse(v) : []; }
  catch(e){ categorias = []; }
}
function guardarCats(){
  try { localStorage.setItem(CLAVE_CAT, JSON.stringify(categorias)); } catch(e){}
}
function llenarCats(sel){
  var s = document.getElementById("cat");
  s.textContent = "";
  var o = document.createElement("option"); o.value = ""; o.textContent = "Sin categoría"; s.append(o);
  categorias.forEach(function(c){
    var x = document.createElement("option"); x.value = c; x.textContent = c; s.append(x);
  });
  var n = document.createElement("option"); n.value = "__nueva"; n.textContent = "+ Nueva categoría…"; s.append(n);
  s.value = sel || "";
  if(s.value !== (sel || "")){ s.value = ""; }
  document.getElementById("catNueva").style.display = "none";
  document.getElementById("catNueva").value = "";
  refrescarCats();
}
function limpiarForm(){
  editando = null;
  ["titulo","texto","lugar","media","inFoto","inVideo"].forEach(function(i){ document.getElementById(i).value = ""; });
  archivosSel = []; refrescarSel();
  document.getElementById("fecha").value = hoy();
  llenarCats("");
  coords = null; mostrarCoords();
  if(pinElegido && mp){ mp.removeLayer(pinElegido); pinElegido = null; }
  document.getElementById("guardar").textContent = "Guardar recuerdo";
  document.getElementById("cancelar").style.display = "none";
  document.getElementById("aviso").textContent = "";
}
function iniciarEdicion(n){
  editando = n.id;
  document.getElementById("fecha").value = n.fecha.slice(0,10);
  document.getElementById("titulo").value = n.titulo || "";
  document.getElementById("texto").value = n.texto || "";
  document.getElementById("lugar").value = n.lugar || "";
  document.getElementById("media").value = ""; archivosSel = []; refrescarSel();
  llenarCats(n.categoria);
  coords = null; if(n.ubicacion){ fijarCoords(n.ubicacion.lat, n.ubicacion.lon); } else { mostrarCoords(); }
  document.getElementById("guardar").textContent = "Guardar cambios";
  document.getElementById("cancelar").style.display = "block";
  document.getElementById("aviso").textContent = n.media.length ? "Los archivos actuales se mantienen; los nuevos se suman." : "";
  vista("nuevo");
}
function hoy(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function formatear(f){
  var s = f.slice(0,10).split("-");
  return new Date(+s[0], +s[1]-1, +s[2]).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function dibujar(soloLista){
  if(!soloLista) pintarPines();
  var lista = document.getElementById("lista");
  lista.textContent = "";
  var vis = filtradas(true);
  document.getElementById("contador").textContent = vis.length + (vis.length === 1 ? " recuerdo" : " recuerdos") + (hayFiltros() ? " con los filtros actuales" : "");
  document.getElementById("qLimpiar").style.display = hayFiltros() ? "inline-block" : "none";
  if(!vis.length){
    var v = document.createElement("div");
    v.className = "vacio";
    v.textContent = entradas.length ? "No hay recuerdos con estos filtros." : "Todavía no hay recuerdos. Abrí el menú y elegí Nuevo recuerdo.";
    lista.appendChild(v);
    return;
  }
  vis.sort(function(a,b){return (b.fecha.slice(0,10)+(b.creada||b.fecha)).localeCompare(a.fecha.slice(0,10)+(a.creada||a.fecha))}).forEach(function(n){
    var d = document.createElement("article"); d.className = "nota card"; d.id = "r-" + n.id;
    var t = document.createElement("time"); t.dateTime = n.fecha.slice(0,10); t.textContent = formatear(n.fecha);
    var c = document.createElement("span"); c.className = "etq"; c.textContent = n.categoria || "Sin categoría";
    var h = document.createElement("h3"); h.textContent = n.titulo || "Sin título";
    var p = document.createElement("p"); p.textContent = n.texto;
    var l = null;
    if(n.lugar || n.ubicacion){
      l = document.createElement("p"); l.className = "lugar";
      l.append("📍 " + (n.lugar || "Ubicación guardada"));
      if(n.ubicacion){
        var a = document.createElement("a");
        a.href = "https://www.google.com/maps?q=" + n.ubicacion.lat + "," + n.ubicacion.lon;
        a.target = "_blank"; a.rel = "noopener"; a.textContent = " Ver en el mapa";
        l.append(a);
      }
    }
    var b = document.createElement("button"); b.className = "del"; b.type = "button"; b.textContent = "Borrar recuerdo";
    var e = document.createElement("button"); e.className = "del"; e.type = "button"; e.textContent = "Editar recuerdo";
    e.onclick = function(){ if(confirm("¿Está " + gen("seguro","segura","segure") + " de que desea editar este recuerdo?")) iniciarEdicion(n); };
    b.onclick = function(){
      if(confirm("¿Está " + gen("seguro","segura","segure") + " de que desea borrar este recuerdo? Esta acción no se puede deshacer.")){
        n.media.forEach(function(m){ borrarMedia(m.id); });
        entradas = entradas.filter(function(x){return x.id !== n.id});
        guardarTodo(); dibujar();
      }
    };
    d.append(t,c,h);
    if(n.media.length){
      var box = document.createElement("div");
      box.className = "media";
      d.append(box);
      n.media.forEach(function(m){ mostrarMedia(box, m); });
    }
    d.append(p);
    if(l) d.append(l);
    d.append(e); d.append(b);
    lista.appendChild(d);
  });
}
document.getElementById("guardar").onclick = async function(){
  var titulo = document.getElementById("titulo").value.trim();
  var texto = document.getElementById("texto").value.trim();
  var fecha = document.getElementById("fecha").value;
  var lugar = document.getElementById("lugar").value.trim();
  var archivos = archivosSel.slice();
  var aviso = document.getElementById("aviso");
  var previo = editando ? entradas.filter(function(x){return x.id === editando})[0] : null;
  var catSel = document.getElementById("cat").value;
  var categoria = null;
  if(catSel === "__nueva"){
    var nombreNueva = document.getElementById("catNueva").value.trim();
    if(nombreNueva){
      if(categorias.indexOf(nombreNueva) < 0){ categorias.push(nombreNueva); guardarCats(); }
      categoria = nombreNueva;
    }
  } else if(catSel){ categoria = catSel; }
  if(!titulo && !texto && !archivos.length && !(previo && previo.media.length)){ aviso.textContent = "Escribí un título o un texto antes de guardar."; return; }
  if(!coords){ aviso.textContent = "Elegí el lugar del recuerdo: buscalo, marcalo en el mapa o usá tu ubicación."; return; }
  aviso.textContent = "";
  var id = previo ? previo.id : Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  var media = previo ? previo.media.slice() : [];
  for(var k = 0; k < archivos.length; k++){
    var archivo = archivos[k];
    var esVideo = archivo.type.indexOf("video") === 0;
    if(esVideo && archivo.size > 80*1024*1024){ aviso.textContent = "Un video pesa más de 80 MB. Elegí uno más corto."; return; }
    try {
      var blob = esVideo ? archivo : await reducirImagen(archivo);
      var mid = id + "-" + Date.now().toString(36) + k;
      await guardarMedia(mid, blob);
      media.push({id: mid, tipo: esVideo ? "video" : "foto"});
    } catch(e){ aviso.textContent = "No se pudo guardar un archivo en este dispositivo."; return; }
  }
  var nueva = {
    id: id,
    titulo: titulo, texto: texto,
    fecha: fecha || hoy(), creada: previo ? (previo.creada || previo.fecha) : new Date().toISOString(),
    lugar: lugar || null, ubicacion: coords,
    categoria: categoria, media: media
  };
  if(previo){ entradas = entradas.map(function(x){ return x.id === id ? nueva : x; }); }
  else { entradas.push(nueva); }
  if(!guardarTodo()){ aviso.textContent = "No se pudo guardar en este dispositivo."; }
  document.getElementById("titulo").value = "";
  document.getElementById("texto").value = "";
  document.getElementById("lugar").value = "";
  document.getElementById("fecha").value = hoy();
  limpiarForm();
  dibujar();
  vista(vistaLista);
};
var coords = null;
function mostrarCoords(){
  document.getElementById("estadoUbic").textContent = coords ? "Ubicación añadida ✓" : "";
}
document.getElementById("ubic").onclick = function(){
  var estado = document.getElementById("estadoUbic");
  if(!navigator.geolocation){ estado.textContent = "Este dispositivo no permite obtener la ubicación."; return; }
  estado.textContent = "Buscando ubicación…";
  navigator.geolocation.getCurrentPosition(function(pos){
    fijarCoords(pos.coords.latitude, pos.coords.longitude);
  }, function(){
    coords = null;
    estado.textContent = "No se pudo obtener la ubicación. Revisá el permiso o escribí el lugar a mano.";
  }, {enableHighAccuracy:false, timeout:10000});
};
document.getElementById("fecha").value = hoy();
document.getElementById("fecha").max = hoy();
cargar(); cargarCats(); llenarCats("");
var mp = null, capa = null, eligiendo = false, pinElegido = null;
function iniciarMapa(){
  if(!window.L){ document.getElementById("mapa").textContent = "No se pudo cargar el mapa. Revisá tu conexión."; return; }
  mp = L.map("mapa", {worldCopyJump:true}).setView([20,0], 2);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(mp);
  capa = L.markerClusterGroup();
  mp.addLayer(capa);
  mp.on("moveend", function(){ if(document.getElementById("qZona").checked) dibujar(true); });
  mp.on("click", function(ev){
    if(!eligiendo) return;
    eligiendo = false;
    fijarCoords(ev.latlng.lat, ev.latlng.lng);
  });
  pintarPines();
}
function pintarPines(){
  if(!capa) return;
  capa.clearLayers();
  filtradas(false).forEach(function(n){
    if(!n.ubicacion) return;
    var m = L.marker([n.ubicacion.lat, n.ubicacion.lon]);
    var d = document.createElement("div");
    var b = document.createElement("b"); b.textContent = n.titulo || "Sin título";
    d.append(b, document.createElement("br"), formatear(n.fecha));
    m.bindPopup(d);
    m.on("click", function(){ irARecuerdo(n.id); });
    capa.addLayer(m);
  });
}
function irARecuerdo(id){
  var el = document.getElementById("r-" + id);
  if(!el) return;
  el.classList.add("resaltado");
  setTimeout(function(){ el.classList.remove("resaltado"); }, 2500);
}
function fijarCoords(lat, lon, nombre){
  coords = {lat: +lat.toFixed(5), lon: +lon.toFixed(5)};
  if(nombre) document.getElementById("lugar").value = nombre;
  mostrarCoords();
  if(mp){
    if(pinElegido) mp.removeLayer(pinElegido);
    pinElegido = L.circleMarker([coords.lat, coords.lon], {radius:9}).addTo(mp);
    mp.setView([coords.lat, coords.lon], Math.max(mp.getZoom(), 12));
  }
}
function mostrarMapa(v){
  document.getElementById("mapaBox").style.display = v ? "block" : "none";
  if(v && mp) setTimeout(function(){ mp.invalidateSize(); }, 50);
}
document.getElementById("enMapa").onclick = function(){
  mostrarMapa(true);
  eligiendo = true;
  document.getElementById("estadoUbic").textContent = "Tocá el mapa para marcar el lugar.";
  window.scrollTo({top:0, behavior:"smooth"});
};
document.getElementById("buscar").onclick = async function(){
  var q = document.getElementById("lugar").value.trim();
  var cont = document.getElementById("sugs");
  var estado = document.getElementById("estadoUbic");
  cont.textContent = "";
  if(!q) return;
  estado.textContent = "Buscando…";
  try {
    var r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=es&q=" + encodeURIComponent(q));
    var datos = await r.json();
    estado.textContent = datos.length ? "Tocá el lugar correcto:" : "No encontré ese lugar. Probá con otro nombre o marcalo en el mapa.";
    datos.forEach(function(d){
      var b = document.createElement("button");
      b.type = "button"; b.className = "sug"; b.textContent = d.display_name;
      b.onclick = function(){
        var partes = d.display_name.split(", ");
        cont.textContent = "";
        fijarCoords(parseFloat(d.lat), parseFloat(d.lon), partes.length > 1 ? partes[0] + ", " + partes[partes.length-1] : partes[0]);
      };
      cont.append(b);
    });
  } catch(e){ estado.textContent = "No se pudo buscar. Revisá tu conexión."; }
};
async function exportar(){
  var est = document.getElementById("estadoCopia");
  if(typeof JSZip === "undefined"){ est.textContent = "No se pudo cargar el módulo de copias. Revisá tu conexión."; return; }
  est.textContent = "Preparando la copia…";
  try {
    var zip = new JSZip(), mimes = {};
    for(var i = 0; i < entradas.length; i++){
      var ms = entradas[i].media || [];
      for(var j = 0; j < ms.length; j++){
        var blob = await leerMedia(ms[j].id);
        if(blob){ mimes[ms[j].id] = blob.type || ""; zip.file("media/" + ms[j].id, blob); }
      }
    }
    zip.file("datos.json", JSON.stringify({version:2, exportado:new Date().toISOString(), categorias:categorias, mimes:mimes, perfil:perfil, entradas:entradas}, null, 1));
    var out = await zip.generateAsync({type:"blob"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(out);
    a.download = "diario-copia-" + hoy() + ".zip";
    document.body.append(a); a.click(); a.remove();
    est.textContent = "Copia lista: " + entradas.length + " recuerdos. Guardala en tu nube.";
  } catch(e){ est.textContent = "No se pudo crear la copia."; }
}
async function importar(file){
  var est = document.getElementById("estadoCopia");
  est.textContent = "Importando…";
  try {
    var zip = await JSZip.loadAsync(file);
    var datos = JSON.parse(await zip.file("datos.json").async("string"));
    var ids = {};
    entradas.forEach(function(x){ ids[x.id] = true; });
    var nuevos = 0, ya = 0;
    for(var i = 0; i < datos.entradas.length; i++){
      var n = datos.entradas[i];
      if(ids[n.id]){ ya++; continue; }
      normalizar(n);
      var okMedia = [];
      for(var j = 0; j < n.media.length; j++){
        var mm = n.media[j];
        var f = zip.file("media/" + mm.id);
        if(f){
          var ab = await f.async("arraybuffer");
          await guardarMedia(mm.id, new Blob([ab], {type: (datos.mimes || {})[mm.id] || ""}));
          okMedia.push(mm);
        }
      }
      n.media = okMedia;
      entradas.push(n); nuevos++;
    }
    (datos.categorias || []).forEach(function(c){ if(categorias.indexOf(c) < 0) categorias.push(c); });
    guardarTodo(); guardarCats(); llenarCats(""); dibujar();
    est.textContent = "Listo: " + nuevos + " recuerdos importados" + (ya ? " (" + ya + " ya estaban)." : ".");
  } catch(e){ est.textContent = "No se pudo importar. Revisá que sea una copia del diario (.zip)."; }
}
document.getElementById("bExp").onclick = exportar;
document.getElementById("bImp").onclick = function(){ document.getElementById("inImp").click(); };
document.getElementById("inImp").onchange = function(){ var f = this.files[0]; this.value = ""; if(f) importar(f); };
var CLAVE_PERFIL = "diario:perfil";
var perfil = null;
function cargarPerfil(){
  try { var v = localStorage.getItem(CLAVE_PERFIL); perfil = v ? JSON.parse(v) : null; }
  catch(e){ perfil = null; }
}
function gen(m, f, o){
  var g = perfil && perfil.genero;
  return g === "mujer" ? f : (g === "otre" ? o : m);
}
function mostrarPerfil(){
  document.getElementById("estadoPerfil").textContent = perfil ? perfil.nombre : "";
  document.getElementById("saludo").textContent = perfil ? gen("Bienvenido","Bienvenida","Bienvenide") + ", " + perfil.nombre : "";
}
function abrirPerfil(obligatorio){
  document.getElementById("pNombre").value = perfil ? perfil.nombre : "";
  document.getElementById("pGenero").value = perfil ? perfil.genero : "";
  document.getElementById("pAviso").textContent = "";
  document.getElementById("pCerrar").style.display = obligatorio ? "none" : "block";
  document.getElementById("perfilTitulo").textContent = perfil ? "Tu perfil" : "Creá tu perfil";
  document.getElementById("perfilBox").style.display = "block";
  window.scrollTo(0, 0);
}
document.getElementById("pGuardar").onclick = function(){
  var nombre = document.getElementById("pNombre").value.trim();
  var genero = document.getElementById("pGenero").value;
  var av = document.getElementById("pAviso");
  if(!nombre || !genero){ av.textContent = "Completá tu nombre y elegí una opción."; return; }
  try { localStorage.setItem(CLAVE_PERFIL, JSON.stringify({nombre: nombre, genero: genero})); }
  catch(e){ av.textContent = "No se pudo guardar en este dispositivo."; return; }
  perfil = {nombre: nombre, genero: genero};
  mostrarPerfil();
  document.getElementById("perfilBox").style.display = "none";
};
document.getElementById("pCerrar").onclick = function(){ document.getElementById("perfilBox").style.display = "none"; };
document.getElementById("bPerfil").onclick = function(){ abrirPerfil(false); };
cargarPerfil(); mostrarPerfil();
if(!perfil) abrirPerfil(true);
var vistaLista = "mapa";
function norm(t){ return (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function hayFiltros(){
  return !!document.getElementById("qTexto").value.trim() || (document.getElementById("qCat").value || "__todas") !== "__todas" || document.getElementById("qZona").checked;
}
function filtradas(conZona){
  var q = norm(document.getElementById("qTexto").value.trim());
  var c = document.getElementById("qCat").value || "__todas";
  var b = (conZona && document.getElementById("qZona").checked && mp) ? mp.getBounds() : null;
  return entradas.filter(function(n){
    if(c === "__sin" && n.categoria) return false;
    if(c !== "__todas" && c !== "__sin" && n.categoria !== c) return false;
    if(q && norm((n.titulo || "") + " " + (n.texto || "") + " " + (n.lugar || "")).indexOf(q) < 0) return false;
    if(b && !(n.ubicacion && b.contains([n.ubicacion.lat, n.ubicacion.lon]))) return false;
    return true;
  });
}
function refrescarCats(){
  var q = document.getElementById("qCat");
  var actual = q.value || "__todas";
  var mc = document.getElementById("menuCats");
  q.textContent = ""; mc.textContent = "";
  var ops = [["__todas","Todas"],["__sin","Sin categoría"]].concat(categorias.map(function(c){ return [c,c]; }));
  ops.forEach(function(o){
    var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; q.append(op);
    var b = document.createElement("button"); b.type = "button"; b.className = "it sub"; b.textContent = o[1];
    b.onclick = function(){ q.value = o[0]; dibujar(); vista(vistaLista); };
    mc.append(b);
  });
  q.value = ops.some(function(o){ return o[0] === actual; }) ? actual : "__todas";
}
function abrirMenu(){
  document.getElementById("menu").style.transform = "translateX(0)";
  document.getElementById("cortina").style.display = "block";
}
function cerrarMenu(){
  document.getElementById("menu").style.transform = "translateX(-105%)";
  document.getElementById("cortina").style.display = "none";
}
function vista(v){
  if(v === "mapa" || v === "hilo") vistaLista = v;
  document.getElementById("secForm").style.display = v === "nuevo" ? "block" : "none";
  document.getElementById("secBuscar").style.display = v === "buscar" ? "block" : "none";
  document.getElementById("secLista").style.display = (v === "mapa" || v === "hilo" || v === "buscar") ? "block" : "none";
  document.getElementById("secPerfil").style.display = v === "perfil" ? "block" : "none";
  document.getElementById("secCopia").style.display = v === "copia" ? "block" : "none";
  mostrarMapa(v === "mapa" || v === "nuevo" || (v === "buscar" && vistaLista === "mapa"));
  cerrarMenu();
  window.scrollTo(0, 0);
}

document.getElementById("cat").onchange = function(){

};
document.getElementById("cancelar").onclick = function(){ limpiarForm(); vista(vistaLista); };
var archivosSel = [];
function refrescarSel(){
  var n = archivosSel.length;
  document.getElementById("estadoMedia").textContent = n ? n + (n === 1 ? " archivo listo" : " archivos listos") : "";
  document.getElementById("vaciar").style.display = n ? "block" : "none";
}
function elegir(inp){
  for(var i = 0; i < inp.files.length; i++) archivosSel.push(inp.files[i]);
  inp.value = "";
  refrescarSel();
}
document.getElementById("vaciar").onclick = function(){ archivosSel = []; refrescarSel(); };
[["bFoto","inFoto"],["bVideo","inVideo"],["bGaleria","media"]].forEach(function(p){
  var inp = document.getElementById(p[1]);
  document.getElementById(p[0]).onclick = function(){ inp.click(); };
  inp.onchange = function(){ elegir(inp); };
});
